<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - NeuroInsight AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(rgba(15,23,42,0.88),rgba(15,23,42,0.88)),
    url('https://images.unsplash.com/photo-1532187643603-ba119ca4109e?q=80&w=1470&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
}

.login-container{
    width:100%;
    max-width:450px;
    background:white;
    padding:45px;
    border-radius:28px;
    box-shadow:0 10px 40px rgba(0,0,0,0.25);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h1{
    font-size:34px;
    color:#0f172a;
}

.logo span{
    color:#2563eb;
}

.logo p{
    margin-top:10px;
    color:#64748b;
}

.form-group{
    margin-bottom:22px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#334155;
}

.form-group input{
    width:100%;
    padding:15px;
    border:1px solid #cbd5e1;
    border-radius:14px;
    font-size:15px;
    outline:none;
    transition:0.3s;
}

.form-group input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,0.15);
}

.login-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.login-btn:hover{
    background:#1d4ed8;
}

.bottom-text{
    text-align:center;
    margin-top:25px;
    color:#64748b;
}

.bottom-text a{
    color:#2563eb;
    text-decoration:none;
    font-weight:600;
}

.error{
    background:#fee2e2;
    color:#dc2626;
    padding:12px;
    border-radius:12px;
    margin-bottom:20px;
    text-align:center;
}

/* PASSWORD */

.password-box{
    position:relative;
}

.password-box input{
    width:100%;
    padding-right:55px;
}

.toggle-password{
    position:absolute;
    right:18px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:18px;
}

</style>

</head>

<body>

<div class="login-container">

    <div class="logo">

        <h1>Neuro<span>Insight</span></h1>

        <p>AI Powered Brain Tumor Detection System</p>

    </div>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">

        <!-- EMAIL -->

        <div class="form-group">

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>

        <!-- PASSWORD -->

        <div class="form-group">

            <label>Password</label>

            <div class="password-box">

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <span
                    class="toggle-password"
                    onclick="toggleLoginPassword()"
                >
                    👁
                </span>

            </div>

        </div>

        <!-- LOGIN BUTTON -->

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <!-- BOTTOM -->

    <div class="bottom-text">

        Don't have an account?

        <a href="/signup">
            Sign Up
        </a>

    </div>

</div>

<script>

function toggleLoginPassword(){

    const password =
    document.getElementById(
        "loginPassword"
    );

    if(password.type === "password"){

        password.type = "text";

    }else{

        password.type = "password";
    }
}

</script>

</body>
</html>
